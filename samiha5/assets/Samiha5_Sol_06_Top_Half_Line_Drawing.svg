    <path d="M 209 202 C 228 203 246 205 256 219 C 268 212 273 208 287 211"/>
    <path d="M 257 245 C 268 260 280 278 299 291"/>
    <path d="M 402 284 C 410 296 411 331 392 361"/>
    <path d="M 227 297 C 247 290 274 290 299 293"/>
    <path d="M 226 339 C 240 360 254 370 272 378"/>
    <path d="M 310 313 C 308 330 295 348 285 367"/>
    <path d="M 190 346 C 179 367 174 394 184 419"/>
    <path d="M 261 420 C 269 408 276 399 286 393"/>
    <path d="M 221 467 C 233 492 251 507 274 518"/>
