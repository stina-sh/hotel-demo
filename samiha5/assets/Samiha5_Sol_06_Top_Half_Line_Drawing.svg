<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700">
  <g id="cut-profiles" fill="none" stroke="#111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- The wide, tapering S ribbon is the dominant metal, meeting the mirror seam at its top. -->
    <path d="M 500 100 C 469 91 426 98 398 121 C 377 139 374 165 383 192 C 392 222 422 248 427 281 C 433 317 423 352 402 382 C 378 417 335 448 294 484 C 271 504 250 524 243 541 C 252 548 270 553 289 557 C 305 537 319 522 338 504 C 384 465 431 434 463 389 C 486 355 499 319 500 278 L 500 100 Z"/>
    <!-- Small shoulder frame: the source has a scalloped wire edge, not a filled crown. -->
    <path d="M 382 194 C 352 164 316 165 284 190 C 260 173 234 176 209 199 C 171 191 141 211 126 245 C 112 276 110 313 111 349 L 119 348 C 119 309 123 278 136 249 C 152 217 177 202 209 208 C 231 187 257 184 283 200 C 317 175 346 177 377 206 Z"/>
    <!-- Pierced ornament's outer beaded edge tapers toward the ribbon tip. -->
    <path d="M 111 349 C 105 386 105 430 117 467 C 133 491 158 509 190 518 C 213 525 231 530 246 539 L 254 531 C 235 517 214 512 193 505 C 162 495 140 477 127 455 C 117 420 117 382 119 348 Z"/>
    <!-- Upper leaf pair: inner leaf is broad and almost horizontal; outer leaf tilts down. -->
    <path d="M 287 211 C 312 190 344 185 377 205 C 353 229 320 233 287 211 Z"/>
    <path d="M 197 235 C 214 210 238 207 256 219 C 251 245 231 261 204 257 C 199 253 197 244 197 235 Z"/>
    <!-- Middle pair.  These are offset, not a repeated vertical petal chain. -->
    <path d="M 299 291 C 328 268 363 267 402 282 C 378 309 345 319 309 306 C 302 302 299 298 299 291 Z"/>
    <path d="M 169 318 C 184 293 207 285 227 294 C 231 317 217 338 190 345 C 179 343 173 332 169 318 Z"/>
    <!-- Lower pair, with the outer leaf leading into the tapered end of the lattice. -->
