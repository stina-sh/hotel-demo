    <path d="M 188 420 C 209 402 237 402 259 420 C 259 446 244 461 221 462 C 203 458 192 442 188 420 Z"/>
    <!-- Short metal bridges show the leaf tips joining the scalloped lattice. -->
    <path d="M 375 203 L 382 194 L 389 201 L 379 211 Z"/>
    <path d="M 197 235 C 175 219 155 218 139 229 L 134 239 C 156 229 174 233 198 244 Z"/>
    <path d="M 397 280 L 424 273 L 427 285 L 403 291 Z"/>
    <path d="M 169 316 C 147 308 130 313 114 320 L 114 332 C 134 324 150 325 174 327 Z"/>
    <path d="M 365 363 L 411 357 L 415 369 L 369 376 Z"/>
    <path d="M 188 420 C 162 402 138 402 109 416 L 110 428 C 140 414 162 421 191 431 Z"/>
  </g>
  <g id="ornament" fill="none" stroke="#444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Beaded scallops are editable centerline guides; broad metal is above in cut-profiles. -->
    <path d="M 287 211 C 299 241 341 249 377 213"/>
    <path d="M 197 238 C 202 272 234 276 262 240"/>
    <path d="M 298 293 C 305 331 361 338 406 291"/>
    <path d="M 169 320 C 172 358 214 365 237 327"/>
    <path d="M 272 379 C 284 416 333 427 376 386"/>
    <path d="M 188 423 C 191 471 242 485 272 445"/>
