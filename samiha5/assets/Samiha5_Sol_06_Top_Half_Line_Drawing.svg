    <path d="M 333 232 L 333 244"/>
    <path d="M 222 257 L 222 271"/>
    <path d="M 348 317 L 348 331"/>
    <path d="M 199 344 L 199 357"/>
    <path d="M 323 403 L 323 420"/>
    <path d="M 227 461 L 227 475"/>
  </g>
  <g id="guides" fill="none" stroke="#888" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
