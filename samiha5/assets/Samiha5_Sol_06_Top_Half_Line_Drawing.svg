    <path d="M 393 202 C 422 247 445 274 444 307 C 445 350 419 389 382 424 C 342 462 289 498 258 543"/>
    <path d="M 132 252 C 157 209 180 201 209 204 C 238 182 260 179 284 195 C 319 168 346 172 380 200"/>
