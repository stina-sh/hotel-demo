<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-labelledby="engineering-repair-title engineering-repair-desc" style="color:#7e263b;font-family:Lato,Arial,sans-serif"><title id="engineering-repair-title">AEP: Autonomic Engineering Plane</title><desc id="engineering-repair-desc">Classify incident to Repair session to Validate + admit to Verified hand-back. ACP owns separate capability work. Complete-loop validation in progress · R04.</desc><text x="40" y="43" font-size="17" font-weight="700" fill="currentColor">AEP</text><text x="40" y="87" font-size="28" font-weight="700" fill="#211c1f">Autonomic Engineering Plane</text><path d="M40 117H860" stroke="currentColor" stroke-width="2"/><rect x="40" y="178" width="186.25" height="142" fill="none" stroke="currentColor" stroke-width="2"/><text x="133.125" y="220" text-anchor="middle" font-size="22" font-weight="700" fill="#211c1f"><tspan x="133.125" dy="0">Classify incident</tspan></text><text x="133.125" y="295" text-anchor="middle" font-size="15" fill="#51444a">select repair owner</text><path d="M229.25 249H246.25m-7-6 7 6-7 6" fill="none" stroke="currentColor" stroke-width="2"/><rect x="251.25" y="178" width="186.25" height="142" fill="none" stroke="currentColor" stroke-width="2"/><text x="344.375" y="220" text-anchor="middle" font-size="22" font-weight="700" fill="#211c1f"><tspan x="344.375" dy="0">Repair session</tspan></text><text x="344.375" y="295" text-anchor="middle" font-size="15" fill="#51444a">persistent history</text><path d="M440.5 249H457.5m-7-6 7 6-7 6" fill="none" stroke="currentColor" stroke-width="2"/><rect x="462.5" y="178" width="186.25" height="142" fill="none" stroke="currentColor" stroke-width="2"/><text x="555.625" y="220" text-anchor="middle" font-size="22" font-weight="700" fill="#211c1f"><tspan x="555.625" dy="0">Validate + admit</tspan></text><text x="555.625" y="295" text-anchor="middle" font-size="15" fill="#51444a">independent evidence</text><path d="M651.75 249H