<title id="generation-title">CES and IGS: one complete revision</title><desc id="generation-desc">Canonical Engagement State and Immutable Generation Store share an atomic boundary.</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10" fill="none" stroke="#ad354c" stroke-width="2.4"/></marker><style>text{font-family:Lato,"Noto Sans",Arial,sans-serif;fill:#151515}.heading{font-size:40px;font-weight:700}.subtitle{font-size:24px;fill:#404040}.label{font-size:26px}.small{font-size:22px;fill:#303030}.box-title{font-size:26px;font-weight:700}.badge{font-size:30px;font-weight:700;fill:#ad354c}.box{fill:none;stroke:#747474;stroke-width:2}.box.accent{stroke:#ad354c;stroke-width:3}.line{fill:none;stroke:#747474;stroke-width:2}.arrow{fill:none;stroke:#ad354c;stroke-width:3}.conditional{stroke-dasharray:9 7}.legend{font-size:20px;fill:#404040}</style></defs><text x="40" y="58" class="heading" text-anchor="start">CES and IGS: one complete revision</text><text x="40" y="103" class="subtitle" text-anchor="start">Canonical Engagement State and Immutable Generation Store share an atomic boundary.</text><rect x="40" y="185" width="310" height="150" rx="6" class="box "/><text x="60" y="221" class="box-title" text-anchor="start">Writer A</text><text x="60" y="261" class="small" text-anchor="start">expected head: r</text><text x="60" y="290" class="small" text-anchor="start">candidate: r + 1</text><rect x="40" y="450" width="310" height="150" rx="6" class="box "/><text x="60" y="486" class="box-title" text-anchor="start">Writer B</text><text x="60" y="526" class="small" text-anchor="start">expected head: r</text><text x="60" y="555" class="small" text-anchor="start">competing candidate</text><rect x="425" y="155" width="735" height="520" rx="6" class="box accent"/><text x="450" y="198" class="box-title" text-anchor="start">One PostgreSQL transaction</text><rect x="460" y="230" width="660" height="140" rx="6" class="box "/><text x="480" y="266" class="box-title" text-anchor="start">Validate complete CES revision</text><text x="480" y="306" class="small" text-anchor="start">Reference closure · state and envelope hashes</text><rect x="460" y="430" width="300" height="175" rx="6" class="box "/><text x="480" y="466" class="box-title" text-anchor="start">Insert generation</text><text x="480" y="506" class="small" text-anchor="start">Immutable r + 1</text><text x="480" y="535" class="small" text-anchor="start">Retained parent</text><rect x="820" y="430" width="300" height="175" rx="6" class="box "/><text x="840" y="466" class="box-title" text-anchor="start">Advance head</text><text x="840" y="506" class="small" text-anchor="start">CAS: expected r</text><text x="840" y="535" class="small" text-anchor="start">Publish r + 1</text><path d="M350 260H451" class="arrow " marker-end="url(#arrow)"/><text x="354" y="235" class="small" text-anchor="start">input</text><path d="M760 517H811" class="arrow " marker-end="url(#arrow)"/><path d="M790 370V405H610V421" class="arrow " marker-end="url(#arrow)"/><path d="M350 525H390V710H850V675" class="arrow conditional" marker-end="url(#arrow)"/><text x="445" y="730" class="small" text-anchor="start">stale expected head → conflict</text><path d="M40 775L1160 775" class="line "/><text x="40" y="812" class="legend" text-anchor="start">CAS: compare-and-swap · a stale writer cannot silently replace the current head</text></svg>
