<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="effects-title effects-desc" style="--diagram-accent:#a42f46">
<title id="effects-title">TAC: retain intent and outcome custody</title><desc id="effects-desc">Dispatch success and observed postcondition are different evidence records.</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10" fill="none" stroke="#a42f46" stroke-width="2.4"/></marker><style>text{font-family:Lato,"Noto Sans",Arial,sans-serif;fill:#151515}.heading{font-size:40px;font-weight:700}.subtitle{font-size:24px;fill:#404040}.label{font-size:26px}.small{font-size:22px;fill:#303030}.box-title{font-size:26px;font-weight:700}.badge{font-size:30px;font-weight:700;fill:#a42f46}.box{fill:none;stroke:#747474;stroke-width:2}.box.accent{stroke:#a42f46;stroke-width:3}.line{fill:none;stroke:#747474;stroke-width:2}.arrow{fill:none;stroke:#a42f46;stroke-width:3}.conditional{stroke-dasharray:9 7}.legend{font-size:20px;fill:#404040}</style></defs><text x="40" y="58" class="heading" text-anchor="start">TAC: retain intent and outcome custody</text><text x="40" y="103" class="subtitle" text-anchor="start">Dispatch success and observed postcondition are different evidence records.</text><rect x="40" y="180" width="250" height="190" rx="6" class="box "/><text x="60" y="216" class="box-title" text-anchor="start">Prepared intent</text><text x="60" y="256" class="small" text-anchor="start">Baseline + scope</text><text x="60" y="285" class="small" text-anchor="start">Checkpoint first</text><rect x="345" y="180" width="250" height="190" rx="6" class="box "/><text x="365" y="216" class="box-title" text-anchor="start">Typed dispatch</text><text x="365" y="256" class="small" text-anchor="start">Current lease</text><text x="365" y="285" class="small" text-anchor="start">Execution receipt</text><rect x="650" y="180" width="250" height="190" rx="6" class="box "/><text x="670" y="216" class="box-title" text-anchor="start">Observation</text><text x="670" y="256" class="small" text-anchor="start">Read back the</text><text x="670" y="285" class="small" text-anchor="start">postcondition</text><rect x="935" y="180" width="225" height="190" rx="6" class="box "/><text x="955" y="216" class="box-title" text-anchor="start">Commit</text><text x="955" y="256" class="small" text-anchor="start">Verified</text><text x="955" y="285" class="small" text-anchor="start">outcome</text><text x="955" y="314" class="small" text-anchor="start">Full revision</text><path d="M290 275H336" class="arrow " marker-end="url(#arrow)"/><path d="M595 275H641" class="arrow " marker-end="url(#arrow)"/><path d="M900 275H926" class="arrow " marker-end="url(#arrow)"/><rect x="325" y="520" width="435" height="180" rx="6" class="box accent"/><text x="345" y="556" class="box-title" text-anchor="start">Unknown outcome</text><text x="345" y="596" class="small" text-anchor="start">Lost owner or unverifiable</text><text x="345" y="625" class="small" text-anchor="start">read-back</text><text x="345" y="654" class="small" text-anchor="start">Retain unresolved effect identity</text><rect x="835" y="520" width="325" height="180" rx="6" class="box "/><text x="855" y="556" class="box-title" text-anchor="start">Reconciliation</text><text x="855" y="596" class="small" text-anchor="start">Read-back or attributed</text><text x="855" y="625" class="small" text-anchor="start">decision</text><text x="855" y="654" class="small" text-anchor="start">Establish outcome</text><path d="M470 370V510" class="arrow conditional" marker-end="url(#arrow)"/><text x="480" y="445" class="small" text-anchor="start">ownership lost</text><path d="M775 370V435H675V511" class="arrow conditional" marker-end="url(#arrow)"/><text x="797" y="445" class="small" text-anchor="start">unverifiable</text><path d="M760 610H826" class="arrow conditional" marker-end="url(#arrow)"/><path d="M1047 520V379" class="arrow conditional" marker-end="url(#arrow)"/><text x="40" y="738" class="small" text-anchor="start">TAC · Transactional Action Coordinator: uncertainty does not authorize a blind retry.</text><path d="M40 775L1160 775" class="line "/><text x="40" y="812" class="legend" text-anchor="start">Solid arrow: declared transfer or transition · dashed arrow: conditional branch</text></svg>
