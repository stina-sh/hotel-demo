<title id="diagnostics-title">TMG, SCG and BHG ask different questions</title><desc id="diagnostics-desc">Hypothesis matching, prerequisite diagnostics and policy review retain distinct outputs.</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10" fill="none" stroke="#881d34" stroke-width="2.4"/></marker><style>text{font-family:Lato,"Noto Sans",Arial,sans-serif;fill:#151515}.heading{font-size:40px;font-weight:700}.subtitle{font-size:24px;fill:#404040}.label{font-size:26px}.small{font-size:22px;fill:#303030}.box-title{font-size:26px;font-weight:700}.badge{font-size:30px;font-weight:700;fill:#881d34}.box{fill:none;stroke:#747474;stroke-width:2}.box.accent{stroke:#881d34;stroke-width:3}.line{fill:none;stroke:#747474;stroke-width:2}.arrow{fill:none;stroke:#881d34;stroke-width:3}.conditional{stroke-dasharray:9 7}.legend{font-size:20px;fill:#404040}</style></defs><text x="40" y="58" class="heading" text-anchor="start">TMG, SCG and BHG ask different questions</text><text x="40" y="103" class="subtitle" text-anchor="start">Hypothesis matching, prerequisite diagnostics and policy review retain distinct outputs.</text><rect x="40" y="180" width="350" height="360" rx="6" class="box "/><text x="60" y="216" class="box-title" text-anchor="start">TMG</text><text x="60" y="256" class="small" text-anchor="start">Trigger Methodology Graph</text><text x="60" y="285" class="small" text-anchor="start">Which hypothesis fits?</text><text x="60" y="314" class="small" text-anchor="start">Match or partial-match</text><text x="60" y="343" class="small" text-anchor="start">receipt</text><text x="60" y="372" class="small" text-anchor="start">Diagnostic authority</text><rect x="425" y="180" width="350" height="360" rx="6" class="box "/><text x="445" y="216" class="box-title" text-anchor="start">SCG</text><text x="445" y="256" class="small" text-anchor="start">Shadow Capability Graph</text><text x="445" y="285" class="small" text-anchor="start">Which prerequisite is</text><text x="445" y="314" class="small" text-anchor="start">missing?</text><text x="445" y="343" class="small" text-anchor="start">Hypothetical plan +</text><text x="445" y="372" class="small" text-anchor="start">blockers</text><text x="445" y="401" class="small" text-anchor="start">Diagnostic authority</text><rect x="810" y="180" width="350" height="360" rx="6" class="box "/><text x="830" y="216" class="box-title" text-anchor="start">BHG</text><text x="830" y="256" class="small" text-anchor="start">Bounty Hunting Gate</text><text x="830" y="285" class="small" text-anchor="start">Does policy approve?</text><text x="830" y="314" class="small" text-anchor="start">Explicit review</text><text x="830" y="343" class="small" text-anchor="start">disposition</text><text x="830" y="372" class="small" text-anchor="start">Retained gate authority</text><rect x="40" y="620" width="1120" height="120" rx="6" class="box accent"/><text x="60" y="656" class="box-title" text-anchor="start">Canonical evidence and policy context</text><text x="60" y="696" class="small" text-anchor="start">Each interface consumes declared inputs; no automatic promotion to execution is implied.</text><path d="M40 775L1160 775" class="line "/><text x="40" y="812" class="legend" text-anchor="start">Columns: separate contracts · policy review does not prove an external outcome</text></svg>
