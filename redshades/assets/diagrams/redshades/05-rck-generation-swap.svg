<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="replacement-title replacement-desc" style="--diagram-accent:#98253d">
<title id="replacement-title">RCK: publish, pin, drain and roll back</title><desc id="replacement-desc">Replacement changes availability under exact-generation ownership.</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10" fill="none" stroke="#98253d" stroke-width="2.4"/></marker><style>text{font-family:Lato,"Noto Sans",Arial,sans-serif;fill:#151515}.heading{font-size:40px;font-weight:700}.subtitle{font-size:24px;fill:#404040}.label{font-size:26px}.small{font-size:22px;fill:#303030}.box-title{font-size:26px;font-weight:700}.badge{font-size:30px;font-weight:700;fill:#98253d}.box{fill:none;stroke:#747474;stroke-width:2}.box.accent{stroke:#98253d;stroke-width:3}.line{fill:none;stroke:#747474;stroke-width:2}.arrow{fill:none;stroke:#98253d;stroke-width:3}.conditional{stroke-dasharray:9 7}.legend{font-size:20px;fill:#404040}</style></defs><text x="40" y="58" class="heading" text-anchor="start">RCK: publish, pin, drain and roll back</text><text x="40" y="103" class="subtitle" text-anchor="start">Replacement changes availability under exact-generation ownership.</text><rect x="45" y="180" width="320" height="175" rx="6" class="box accent"/><text x="65" y="216" class="box-title" text-anchor="start">Generation A</text><text x="65" y="256" class="small" text-anchor="start">Existing calls retain A</text><text x="65" y="285" class="small" text-anchor="start">Outstanding leases</text><rect x="835" y="180" width="320" height="175" rx="6" class="box accent"/><text x="855" y="216" class="box-title" text-anchor="start">Generation B</text><text x="855" y="256" class="small" text-anchor="start">Prepared and validated</text><text x="855" y="285" class="small" text-anchor="start">New calls after publish</text><rect x="45" y="490" width="320" height="150" rx="6" class="box "/><text x="65" y="526" class="box-title" text-anchor="start">Existing calls</text><text x="65" y="566" class="small" text-anchor="start">Release their A leases</text><rect x="835" y="490" width="320" height="150" rx="6" class="box "/><text x="855" y="526" class="box-title" text-anchor="start">New calls</text><text x="855" y="566" class="small" text-anchor="start">Acquire B leases</text><path d="M205 490V364" class="arrow " marker-end="url(#arrow)"/><text x="90" y="432" class="small" text-anchor="start">pinned</text><path d="M995 490V364" class="arrow " marker-end="url(#arrow)"/><text x="1009" y="432" class="small" text-anchor="start">resolve</text><path d="M365 240H826" class="arrow " marker-end="url(#arrow)"/><text x="448" y="216" class="small" text-anchor="start">atomic publication</text><path d="M835 318H374" class="arrow conditional" marker-end="url(#arrow)"/><text x="452" y="351" class="small" text-anchor="start">rollback republishes A</text><rect x="435" y="485" width="330" height="175" rx="6" class="box "/><text x="455" y="521" class="box-title" text-anchor="start">Commit and drain</text><text x="455" y="561" class="small" text-anchor="start">A closes after leases</text><text x="455" y="590" class="small" text-anchor="start">release</text><text x="455" y="619" class="small" text-anchor="start">Single-shot cleanup</text><path d="M365 565H426" class="arrow conditional" marker-end="url(#arrow)"/><text x="45" y="718" class="small" text-anchor="start">RCK · Runtime Composition Kernel</text><text x="45" y="749" class="small" text-anchor="start">Provider rollback preserves the history of external effects.</text><path d="M40 775L1160 775" class="line "/><text x="40" y="812" class="legend" text-anchor="start">Solid arrow: declared transfer or transition · dashed arrow: conditional branch</text></svg>
