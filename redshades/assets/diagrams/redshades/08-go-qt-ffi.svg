<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="native-title native-desc" style="--diagram-accent:#81192f">
<title id="native-title">Go and Qt: state out, revisioned intent in</title><desc id="native-desc">The native interface separates application authority from operator presentation.</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10" fill="none" stroke="#81192f" stroke-width="2.4"/></marker><style>text{font-family:Lato,"Noto Sans",Arial,sans-serif;fill:#151515}.heading{font-size:40px;font-weight:700}.subtitle{font-size:24px;fill:#404040}.label{font-size:26px}.small{font-size:22px;fill:#303030}.box-title{font-size:26px;font-weight:700}.badge{font-size:30px;font-weight:700;fill:#81192f}.box{fill:none;stroke:#747474;stroke-width:2}.box.accent{stroke:#81192f;stroke-width:3}.line{fill:none;stroke:#747474;stroke-width:2}.arrow{fill:none;stroke:#81192f;stroke-width:3}.conditional{stroke-dasharray:9 7}.legend{font-size:20px;fill:#404040}</style></defs><text x="40" y="58" class="heading" text-anchor="start">Go and Qt: state out, revisioned intent in</text><text x="40" y="103" class="subtitle" text-anchor="start">The native interface separates application authority from operator presentation.</text><rect x="40" y="180" width="355" height="410" rx="6" class="box accent"/><text x="60" y="216" class="box-title" text-anchor="start">Go application</text><text x="60" y="248" class="box-title" text-anchor="start">services</text><text x="60" y="288" class="small" text-anchor="start">Canonical state and</text><text x="60" y="317" class="small" text-anchor="start">persistence</text><text x="60" y="346" class="small" text-anchor="start">Eligibility and policy</text><text x="60" y="375" class="small" text-anchor="start">checks</text><text x="60" y="404" class="small" text-anchor="start">Receipts and gates</text><text x="60" y="433" class="small" text-anchor="start">Resolve canonical facts</text><rect x="805" y="180" width="355" height="410" rx="6" class="box "/><text x="825" y="216" class="box-title" text-anchor="start">Qt operator</text><text x="825" y="256" class="small" text-anchor="start">Native analytical surfaces</text><text x="825" y="285" class="small" text-anchor="start">Bounded state projections</text><text x="825" y="314" class="small" text-anchor="start">Selected-record detail</text><text x="825" y="343" class="small" text-anchor="start">Attributed human intent</text><path d="M395 240H796" class="arrow " marker-end="url(#arrow)"/><text x="458" y="215" class="small" text-anchor="start">snapshots + deltas</text><path d="M805 352H404" class="arrow " marker-end="url(#arrow)"/><text x="439" y="328" class="small" text-anchor="start">detail request by identity</text><path d="M395 447H796" class="arrow " marker-end="url(#arrow)"/><text x="435" y="422" class="small" text-anchor="start">bounded detail response</text><path d="M805 555H404" class="arrow " marker-end="url(#arrow)"/><text x="470" y="532" class="small" text-anchor="start">revisioned intent</text><text x="40" y="675" class="small" text-anchor="start">FFI · Foreign Function Interface</text><text x="40" y="706" class="small" text-anchor="start">ABI · Application Binary Interface: required symbols and signatures checked before pairing.</text><text x="40" y="737" class="small" text-anchor="start">The UI supplies identity and expected revisions; Go resolves the authoritative record.</text><path d="M40 775L1160 775" class="line "/><text x="40" y="812" class="legend" text-anchor="start">Solid arrow: declared transfer or transition · dashed arrow: conditional branch</text></svg>
