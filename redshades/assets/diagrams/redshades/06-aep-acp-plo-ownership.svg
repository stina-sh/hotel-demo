<title id="engineering-title">AEP and ACP: separate engineering owners</title><desc id="engineering-desc">Routing follows the defect class; neither column is a shortcut to effect authority.</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10" fill="none" stroke="#902139" stroke-width="2.4"/></marker><style>text{font-family:Lato,"Noto Sans",Arial,sans-serif;fill:#151515}.heading{font-size:40px;font-weight:700}.subtitle{font-size:24px;fill:#404040}.label{font-size:26px}.small{font-size:22px;fill:#303030}.box-title{font-size:26px;font-weight:700}.badge{font-size:30px;font-weight:700;fill:#902139}.box{fill:none;stroke:#747474;stroke-width:2}.box.accent{stroke:#902139;stroke-width:3}.line{fill:none;stroke:#747474;stroke-width:2}.arrow{fill:none;stroke:#902139;stroke-width:3}.conditional{stroke-dasharray:9 7}.legend{font-size:20px;fill:#404040}</style></defs><text x="40" y="58" class="heading" text-anchor="start">AEP and ACP: separate engineering owners</text><text x="40" y="103" class="subtitle" text-anchor="start">Routing follows the defect class; neither column is a shortcut to effect authority.</text><rect x="40" y="180" width="510" height="170" rx="6" class="box "/><text x="60" y="216" class="box-title" text-anchor="start">AEP · Autonomic Engineering Plane</text><text x="60" y="256" class="small" text-anchor="start">Product, orchestration, custody or</text><text x="60" y="285" class="small" text-anchor="start">platform defect</text><rect x="650" y="180" width="510" height="170" rx="6" class="box "/><text x="670" y="216" class="box-title" text-anchor="start">ACP · Adaptive Capability Pipeline</text><text x="670" y="256" class="small" text-anchor="start">Missing scoped interaction contract</text><rect x="40" y="435" width="510" height="240" rx="6" class="box accent"/><text x="60" y="471" class="box-title" text-anchor="start">Persistent repair owner</text><text x="60" y="511" class="small" text-anchor="start">Diagnosis and scoped repair</text><text x="60" y="540" class="small" text-anchor="start">Validation, admission and replacement</text><text x="60" y="569" class="small" text-anchor="start">Verified hand-back</text><rect x="650" y="435" width="510" height="240" rx="6" class="box accent"/><text x="670" y="471" class="box-title" text-anchor="start">Persistent generation owner</text><text x="670" y="511" class="small" text-anchor="start">Digest-bound phases and manifest</text><text x="670" y="540" class="small" text-anchor="start">PLO isolates phase diagnostics</text><text x="670" y="569" class="small" text-anchor="start">Controller validates and admits</text><path d="M295 350V426" class="arrow " marker-end="url(#arrow)"/><text x="65" y="401" class="small" text-anchor="start">repair accepted</text><path d="M905 350V426" class="arrow " marker-end="url(#arrow)"/><text x="678" y="401" class="small" text-anchor="start">scoped request</text><text x="40" y="729" class="small" text-anchor="start">Separate incident classes preserve separate ownership.</text><text x="40" y="760" class="small" text-anchor="start">Complete AEP convergence remains under validation.</text><path d="M40 815L1160 815" class="line "/><text x="40" y="852" class="legend" text-anchor="start">PLO: Phase-Level Optimization · a phase receipt does not establish an external outcome</text></svg>
