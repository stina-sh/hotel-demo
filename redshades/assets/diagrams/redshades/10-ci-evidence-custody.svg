<title id="verification-title">Verification receipts bound the claim</title><desc id="verification-desc">CI evidence retains its revision, execution scope and current status.</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10" fill="none" stroke="#701027" stroke-width="2.4"/></marker><style>text{font-family:Lato,"Noto Sans",Arial,sans-serif;fill:#151515}.heading{font-size:40px;font-weight:700}.subtitle{font-size:24px;fill:#404040}.label{font-size:26px}.small{font-size:22px;fill:#303030}.box-title{font-size:26px;font-weight:700}.badge{font-size:30px;font-weight:700;fill:#701027}.box{fill:none;stroke:#747474;stroke-width:2}.box.accent{stroke:#701027;stroke-width:3}.line{fill:none;stroke:#747474;stroke-width:2}.arrow{fill:none;stroke:#701027;stroke-width:3}.conditional{stroke-dasharray:9 7}.legend{font-size:20px;fill:#404040}</style></defs><text x="40" y="58" class="heading" text-anchor="start">Verification receipts bound the claim</text><text x="40" y="103" class="subtitle" text-anchor="start">CI evidence retains its revision, execution scope and current status.</text><rect x="40" y="180" width="340" height="220" rx="6" class="box "/><text x="60" y="216" class="box-title" text-anchor="start">Verification lane</text><text x="60" y="256" class="small" text-anchor="start">Exact source revision</text><text x="60" y="285" class="small" text-anchor="start">Declared checks and</text><text x="60" y="314" class="small" text-anchor="start">bounds</text><text x="60" y="343" class="small" text-anchor="start">Explicit lane status</text><rect x="430" y="180" width="340" height="220" rx="6" class="box accent"/><text x="450" y="216" class="box-title" text-anchor="start">Retained receipt</text><text x="450" y="256" class="small" text-anchor="start">Command and status</text><text x="450" y="285" class="small" text-anchor="start">Bounded output + duration</text><text x="450" y="314" class="small" text-anchor="start">Artifact hashes</text><rect x="820" y="180" width="340" height="220" rx="6" class="box "/><text x="840" y="216" class="box-title" text-anchor="start">Supported claim</text><text x="840" y="256" class="small" text-anchor="start">This revision and fixture</text><text x="840" y="285" class="small" text-anchor="start">This lane and environment</text><text x="840" y="314" class="small" text-anchor="start">Explicit remaining limits</text><path d="M380 290H421" class="arrow " marker-end="url(#arrow)"/><path d="M770 290H811" class="arrow " marker-end="url(#arrow)"/><rect x="40" y="515" width="535" height="160" rx="6" class="box "/><text x="60" y="551" class="box-title" text-anchor="start">Historical operator measurement</text><text x="60" y="591" class="small" text-anchor="start">71,462 dirty pixels / 921,600 viewport</text><text x="60" y="620" class="small" text-anchor="start">Retained fixture and build</text><rect x="625" y="515" width="535" height="160" rx="6" class="box "/><text x="645" y="551" class="box-title" text-anchor="start">Go run 1599: documented status</text><text x="645" y="591" class="small" text-anchor="start">Three root contracts failed</text><text x="645" y="620" class="small" text-anchor="start">New pushed result required after repair</text><text x="40" y="730" class="small" text-anchor="start">A configured lane, historical pass and current passing result are separate evidence states.</text><path d="M40 775L1160 775" class="line "/><text x="40" y="812" class="legend" text-anchor="start">Solid arrow: declared transfer or transition · dashed arrow: conditional branch</text></svg>
