<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="workers-title workers-desc" style="--diagram-accent:#9f2941">
<title id="workers-title">SIC and ISW: records and worker ownership</title><desc id="workers-desc">Specialist references and isolated execution retain separate contracts.</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10" fill="none" stroke="#9f2941" stroke-width="2.4"/></marker><style>text{font-family:Lato,"Noto Sans",Arial,sans-serif;fill:#151515}.heading{font-size:40px;font-weight:700}.subtitle{font-size:24px;fill:#404040}.label{font-size:26px}.small{font-size:22px;fill:#303030}.box-title{font-size:26px;font-weight:700}.badge{font-size:30px;font-weight:700;fill:#9f2941}.box{fill:none;stroke:#747474;stroke-width:2}.box.accent{stroke:#9f2941;stroke-width:3}.line{fill:none;stroke:#747474;stroke-width:2}.arrow{fill:none;stroke:#9f2941;stroke-width:3}.conditional{stroke-dasharray:9 7}.legend{font-size:20px;fill:#404040}</style></defs><text x="40" y="58" class="heading" text-anchor="start">SIC and ISW: records and worker ownership</text><text x="40" y="103" class="subtitle" text-anchor="start">Specialist references and isolated execution retain separate contracts.</text><rect x="40" y="180" width="390" height="450" rx="6" class="box "/><text x="60" y="216" class="box-title" text-anchor="start">SIC · Specialist</text><text x="60" y="248" class="box-title" text-anchor="start">Interchange Contracts</text><text x="60" y="288" class="small" text-anchor="start">Session and result identities</text><text x="60" y="317" class="small" text-anchor="start">Source digest and coordinates</text><text x="60" y="346" class="small" text-anchor="start">Revisions and applicability</text><text x="60" y="375" class="small" text-anchor="start">Projection + lazy detail</text><rect x="575" y="180" width="585" height="190" rx="6" class="box "/><text x="595" y="216" class="box-title" text-anchor="start">ISW · Immutable input envelope</text><text x="595" y="256" class="small" text-anchor="start">Run · stage · attempt · artifact generation</text><text x="595" y="285" class="small" text-anchor="start">Input hash and live lease</text><rect x="575" y="465" width="585" height="200" rx="6" class="box accent"/><text x="595" y="501" class="box-title" text-anchor="start">Result ownership check</text><text x="595" y="541" class="small" text-anchor="start">One bounded result envelope</text><text x="595" y="570" class="small" text-anchor="start">Artifact + input + generation + lease agree</text><text x="595" y="599" class="small" text-anchor="start">Coordinator validates observations</text><path d="M430 305H566" class="arrow conditional" marker-end="url(#arrow)"/><text x="437" y="280" class="small" text-anchor="start">references</text><path d="M865 370V456" class="arrow " marker-end="url(#arrow)"/><text x="884" y="425" class="small" text-anchor="start">bounded worker result</text><text x="40" y="708" class="small" text-anchor="start">SIC preserves fidelity. ISW owns isolated execution boundaries.</text><text x="40" y="739" class="small" text-anchor="start">Stale results are fenced; legacy handlers wait for a scheduler boundary.</text><path d="M40 775L1160 775" class="line "/><text x="40" y="812" class="legend" text-anchor="start">Dashed arrow: declared input references when applicable · ISW: Isolated Stage Workers</text></svg>
