<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="responsibility-title responsibility-desc" style="--diagram-accent:#b54556">
<title id="responsibility-title">RedShades responsibility map</title><desc id="responsibility-desc">Canonical subsystem identities grouped by ownership.</desc><defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 5L0 10" fill="none" stroke="#b54556" stroke-width="2.4"/></marker><style>text{font-family:Lato,"Noto Sans",Arial,sans-serif;fill:#151515}.heading{font-size:40px;font-weight:700}.subtitle{font-size:24px;fill:#404040}.label{font-size:26px}.small{font-size:22px;fill:#303030}.box-title{font-size:26px;font-weight:700}.badge{font-size:30px;font-weight:700;fill:#b54556}.box{fill:none;stroke:#747474;stroke-width:2}.box.accent{stroke:#b54556;stroke-width:3}.line{fill:none;stroke:#747474;stroke-width:2}.arrow{fill:none;stroke:#b54556;stroke-width:3}.conditional{stroke-dasharray:9 7}.legend{font-size:20px;fill:#404040}</style></defs><text x="40" y="58" class="heading" text-anchor="start">RedShades responsibility map</text><text x="40" y="103" class="subtitle" text-anchor="start">Canonical subsystem identities grouped by ownership.</text><rect x="40" y="160" width="1120" height="172" rx="6" class="box accent"/><text x="62" y="196" class="box-title" text-anchor="start">Canonical state and evidence</text><text x="62" y="237" class="small" text-anchor="start">CES · Canonical Engagement State</text><text x="62" y="268" class="small" text-anchor="start">EVC · Evidence Verification and Custody</text><text x="62" y="299" class="small" text-anchor="start">DTE · Deterministic Transformation Engine</text><text x="642" y="237" class="small" text-anchor="start">IGS · Immutable Generation Store</text><text x="642" y="268" class="small" text-anchor="start">SIC · Specialist Interchange Contracts</text><text x="642" y="299" class="small" text-anchor="start">Objective review and derived projections</text><rect x="40" y="345" width="1120" height="172" rx="6" class="box accent"/><text x="62" y="381" class="box-title" text-anchor="start">Context and execution control</text><text x="62" y="422" class="small" text-anchor="start">ECT · Execution Context Timeline</text><text x="62" y="453" class="small" text-anchor="start">TAC · Transactional Action Coordinator</text><text x="62" y="484" class="small" text-anchor="start">WFS · Work Frontier Scheduler</text><text x="642" y="422" class="small" text-anchor="start">PLS · Progress Lease Supervision</text><text x="642" y="453" class="small" text-anchor="start">ADS · AI Decision Service</text><text x="642" y="484" class="small" text-anchor="start">BHG · Bounty Hunting Gate</text><rect x="40" y="530" width="1120" height="172" rx="6" class="box accent"/><text x="62" y="566" class="box-title" text-anchor="start">Runtime ownership and replacement</text><text x="62" y="607" class="small" text-anchor="start">RCK · Runtime Composition Kernel</text><text x="62" y="638" class="small" text-anchor="start">ISW · Isolated Stage Workers</text><text x="642" y="607" class="small" text-anchor="start">Runtime switchboard</text><text x="642" y="638" class="small" text-anchor="start">Process bundles and resource supervisors</text><rect x="40" y="715" width="1120" height="172" rx="6" class="box accent"/><text x="62" y="751" class="box-title" text-anchor="start">Engineering repair and generation</text><text x="62" y="792" class="small" text-anchor="start">AEP · Autonomic Engineering Plane</text><text x="62" y="823" class="small" text-anchor="start">ACP · Adaptive Capability Pipeline</text><text x="642" y="792" class="small" text-anchor="start">PLO · Phase-Level Optimization</text><text x="642" y="823" class="small" text-anchor="start">SPR · Specialist Plugin Registry</text><rect x="40" y="900" width="1120" height="172" rx="6" class="box accent"/><text x="62" y="936" class="box-title" text-anchor="start">Operator and diagnostic views</text><text x="62" y="977" class="small" text-anchor="start">AttackMap · Network Graph · WebRecon</text><text x="62" y="1008" class="small" text-anchor="start">Investigation Graph and Workbench</text><text x="62" y="1039" class="small" text-anchor="start">RCC · Recovery and Continuation Center</text><text x="642" y="977" class="small" text-anchor="start">TMG · Trigger Methodology Graph</text><text x="642" y="1008" class="small" text-anchor="start">SCG · Shadow Capability Graph</text><text x="642" y="1039" class="small" text-anchor="start">Native Go/Qt bridge</text><text x="40" y="1124" class="small" text-anchor="start">Responsibility bands do not prescribe execution order.</text><path d="M40 1155L1160 1155" class="line "/><text x="40" y="1192" class="legend" text-anchor="start">Band outline: responsibility scope · names follow the canonical subsystem glossary</text></svg>
