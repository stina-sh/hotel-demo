<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-labelledby="validated-ai-title validated-ai-desc" style="color:#7e263b;font-family:Lato,Arial,sans-serif"><title id="validated-ai-title">ADS: AI Decision Service</title><desc id="validated-ai-desc">Evidence packet to Provider result to Validation to Decision receipt. Provider output has no authority. Implemented; legacy adoption incomplete · A01.</desc><text x="40" y="43" font-size="17" font-weight="700" fill="currentColor">ADS</text><text x="40" y="87" font-size="28" font-weight="700" fill="#211c1f">AI Decision Service</text><path d="M40 117H860" stroke="currentColor" stroke-width="2"/><rect x="40" y="178" width="186.25" height="142" fill="none" stroke="currentColor" stroke-width="2"/><text x="133.125" y="220" text-anchor="middle" font-size="22" font-weight="700" fill="#211c1f"><tspan x="133.125" dy="0">Evidence packet</tspan></text><text x="133.125" y="295" text-anchor="middle" font-size="15" fill="#51444a">revision-bound</text><path d="M229.25 249H246.25m-7-6 7 6-7 6" fill="none" stroke="currentColor" stroke-width="2"/><rect x="251.25" y="178" width="186.25" height="142" fill="none" stroke="currentColor" stroke-width="2"/><text x="344.375" y="220" text-anchor="middle" font-size="22" font-weight="700" fill="#211c1f"><tspan x="344.375" dy="0">Provider result</tspan></text><text x="344.375" y="295" text-anchor="middle" font-size="15" fill="#51444a">bounded work</text><path d="M440.5 249H457.5m-7-6 7 6-7 6" fill="none" stroke="currentColor" stroke-width="2"/><rect x="462.5" y="178" width="186.25" height="142" fill="none" stroke="currentColor" stroke-width="2"/><text x="555.625" y="220" text-anchor="middle" font-size="22" font-weight="700" fill="#211c1f"><tspan x="555.625" dy="0">Validation</tspan></text><text x="555.625" y="295" text-anchor="middle" font-size="15" fill="#51444a">typed contract</text><path d="M651.75 249H668.75m-7-6 7 6-7 6" fill="none" stroke="currentColor" stroke-width="2"