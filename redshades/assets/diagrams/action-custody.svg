<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" role="img" aria-labelledby="action-custody-title action-custody-desc" style="color:#7e263b;font-family:Lato,Arial,sans-serif"><title id="action-custody-title">TAC: Transactional Action Coordinator</title><desc id="action-custody-desc">Prepared intent to Typed dispatch to Independent read-back. Unknown outcomes require review. Implemented contract · A01.</desc><text x="40" y="43" font-size="17" font-weight="700" fill="currentColor">TAC</text><text x="40" y="87" font-size="28" font-weight="700" fill="#211c1f">Transactional Action Coordinator</text><path d="M40 117H860" stroke="currentColor" stroke-width="2"/><rect x="40" y="178" width="250" height="142" fill="none" stroke="currentColor" stroke-width="2"/><text x="165" y="220" text-anchor="middle" font-size="22" font-weight="700" fill="#211c1f"><tspan x="165" dy="0">Prepared intent</tspan></text><text x="165" y="295" text-anchor="middle" font-size="15" fill="#51444a">baseline + revision</text><path d="M293 249H320m-7-6 7 6-7 6" fill="none" stroke="currentColor" stroke-width="2"/><rect x="325" y="178" width="250" height="142" fill="none" stroke="currentColor" stroke-width="2"/><text x="450" y="220" text-anchor="middle" font-size="22" font-weight="700" fill="#211c1f"><tspan x="450" dy="0">Typed dispatch</tspan></text><text x="450" y="295" text-anchor="middle" font-size="15" fill="#51444a">execution receipt</text><path d="M578 249H605m-7-6 7 6-7 6" fill="none" stroke="currentColor" stroke-width="2"/><rect x="610" y="178" width="250" height="142" fill="none" stroke="currentColor" stroke-width="2"/><text x="735" y="220" text-anchor="middle" font-size="22" font-weight="700" fill="#211c1f"><tspan x="735" dy="0">Independent read-back</tspan></text><text x="735" y="295" text-anchor="middle" font-size="15" fill="#51444a">outcome evidence</text><g font-size="12" font-weight="700" fill="currentColor"><text x="40" y="377">INPUT</text><text x="326" y="377">OUTPUT</text><text x="612" y="377">AUTHORITY BOUNDARY</text></g><text x="40" y="407" font-size="17" fill="#211c1f"><tspan x="40" dy="0">Intent, baseline and</tspan><tspan x="40" dy="24">authority</tspan></text><text x="326" y="407" font-size="17" fill="#211c1f"><tspan x="326" dy="0">Observed result or</tspan><tspan x="326" dy="24">uncertainty</tspan></text><text x="612" y="407" font-size="17" fill="#211c1f"><tspan x="612" dy="0">Unknown outcomes require</tspan><tspan x="612" dy="24">review</tspan></text><path d="M40 470H860" stroke="currentColor"/><text x="40" y="503" font-size="15" fill="#51444a">Implemented contract · A01</text></svg>
